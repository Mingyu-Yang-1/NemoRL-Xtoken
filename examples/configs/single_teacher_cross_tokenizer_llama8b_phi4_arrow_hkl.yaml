# Single-teacher cross-tokenizer distillation: Llama-3.1-8B ← microsoft/phi-4
#
# Same shape as single_teacher_cross_tokenizer_llama8b_qwen3_14b_arrow.yaml,
# differences:
#   - Teacher : microsoft/phi-4 (14B params, vocab=100352, tiktoken-style BPE)
#   - Loss    : H-KL (gold_loss=true, xtoken_loss=true)
#   - Projection: Llama-3.1 (128256) → Phi-4 tokenizer (100352)
#
# H-KL math (gold path):
#   - Build a 1-to-1 student↔teacher bijection from the projection map's
#     top-1 column. With xtoken_loss=true the threshold is relaxed to
#     top1 ≥ 0.6 (vs == 1.0 for strict gold), and collisions are resolved by
#     keeping the highest-weight student for each teacher target.
#   - Common partition: chunk-averaged log_softmax on both sides, sliced to
#     the common indices, F.kl_div(log_target=True) per chunk, mean over
#     valid chunks. Sub-distribution KL — NOT renormalised inside the slice.
#   - Uncommon partition: sort student / teacher uncommon-vocab probs
#     descending, truncate to min(N_us, N_ut, uncommon_topk), L1 loss summed
#     over vocab and meaned across valid chunks.
#   - Combine: loss = (kl_common + l1_uncommon) * temperature**2
#   - **CE is NOT added in the gold path.** `_compute_gold` returns its loss
#     directly; the dispatcher (__call__) does not add CE for gold_loss=true.
#     So `ce_loss_scale`, `dynamic_loss_scaling`, and `kl_loss_weight` are
#     **inert** in this config — kept here for schema completeness.
#
# Steps   : 10000 (LinearLR warmup over 100 → CosineAnnealing T_max=9900 → 0)
# Batch   : global=768 (1 seq/GPU × 256 GPUs on 32 nodes × 8 GPUs/node)

distillation:
  num_prompts_per_step: 768
  max_num_steps: 10000
  max_num_epochs: 100
  seed: 42
  val_period: 0
  val_at_start: false
  val_at_end: false

loss_fn:
  projection_matrix_path: "/lustre/fsw/portfolios/coreai/users/mingyyang/xtoken_nemorl_v1/cross_tokenizer_data/projection_map_Llama-3.1_to_Phi-4_multitoken_top_4_special.pt"
  gold_loss: true          # ← H-KL dispatch
  xtoken_loss: true        # ← relaxed exact-map threshold (0.6) + collision-aware
  temperature: 1.0
  vocab_topk: 8192         # inert in gold path (P-KL only)
  uncommon_topk: 8192      # cap on the ULD sorted-tail width
  reverse_kl: false
  exact_token_match_only: false
  project_teacher_to_student: false
  kl_loss_weight: 1.0          # inert in gold path
  ce_loss_scale: 0.1           # inert in gold path (no CE term)
  dynamic_loss_scaling: false  # no effect on gold path; set false for clarity
  kl_chunk_shift: true   # PT shift-by-1 convention; matches upstream xtoken_v1

checkpointing:
  enabled: true
  checkpoint_dir: "checkpoints/single-teacher-llama8b-phi4-hkl"
  metric_name: "train:loss"
  higher_is_better: false
  keep_top_k: 10
  save_period: 100
  checkpoint_must_save_by: null
  save_optimizer: true
  model_save_format: "safetensors"
  save_consolidated: false

policy:
  model_name: "meta-llama/Llama-3.1-8B"
  tokenizer:
    name: "meta-llama/Llama-3.1-8B"
    chat_template: null
  train_global_batch_size: 768
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 2048
  make_sequence_length_divisible_by: 1
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: true
  dtensor_cfg:
    enabled: true
    _v2: true
    cpu_offload: true
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
  max_grad_norm: 1.0
  dynamic_batching:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    sequence_length_round: 64
  sequence_packing:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64
  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 5.0e-5
      weight_decay: 0.001
      betas: [0.9, 0.95]
      eps: 1e-8
      foreach: false
      fused: false
  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 0.02
        end_factor: 1.0
        total_iters: 100
    - name: "torch.optim.lr_scheduler.CosineAnnealingLR"
      kwargs:
        T_max: 9900           # steps 101–10000
        eta_min: 0.0
    - milestones: [100]
  generation: null

teacher:
  model_name: "microsoft/phi-4"
  tokenizer:
    name: "microsoft/phi-4"
    chat_template: null
  train_global_batch_size: 768
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 2048
  make_sequence_length_divisible_by: 1
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false
  dtensor_cfg:
    enabled: true
    _v2: true
    load_precision: "bfloat16"
    shard_before_load: true
    cpu_offload: true           # 14B teacher — offload to relieve GPU memory
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
  max_grad_norm: 1.0
  dynamic_batching:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    sequence_length_round: 64
  sequence_packing:
    enabled: false
    train_mb_tokens: 2048
    logprob_mb_tokens: 2048
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64
  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 5.0e-5
      weight_decay: 0.001
      betas: [0.9, 0.95]
      eps: 1e-8
      foreach: false
      fused: false
  generation: null

data:
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 4
  train:
    dataset_name: "arrow_text"
    processor: "kd_data_processor"
    arrow_files: "/lustre/fsw/portfolios/llmservice/users/sdiao/data/climb_nm5.5_phase3_400b_shuffled_text_only_global_shuffle/data-00[0-9][0-9][0-9]-of-02476.arrow"
    text_key: "text"
    characters_per_sample: 16384
  validation: null

logger:
  log_dir: "logs/single-teacher-llama8b-phi4-hkl"
  num_val_samples_to_print: 5
  wandb_enabled: true
  swanlab_enabled: false
  mlflow_enabled: false
  tensorboard_enabled: false
  monitor_gpus: true
  wandb:
    project: "x_token"
    name: "single-teacher-llama8b-phi4-hkl"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 32
